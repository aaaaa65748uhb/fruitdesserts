name: RecipeLens — checks & Android APK

on:
  push:
    branches:
      - "claude/recipelens-full-stack-mkrpwi"
      - main
    paths:
      - "recipelens/**"
      - ".github/workflows/recipelens.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend the APK should talk to (VITE_API_BASE_URL)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipelens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recipelens/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: recipelens-web-dist
          path: recipelens/web/dist
          retention-days: 14

  android:
    name: Build Android APK
    needs: checks
    runs-on: ubuntu-latest
    # Needed to attach the APK to the preview release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: recipelens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recipelens/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web client
        # VITE_API_BASE_URL tells the APK which backend to call. It is a plain
        # URL, not a secret: the APK holds no AI key and no database credential.
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.RECIPELENS_API_BASE_URL }}
        run: npm run build

      - name: Sync the Capacitor Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: recipelens/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Show what was produced
        working-directory: recipelens/android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: RecipeLens-debug-apk
          path: recipelens/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # A direct .apk link so the app can be installed from a phone browser
      # without a GitHub login or an unzip step.
      - name: Publish the APK to the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: recipelens-preview
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" RecipeLens-debug.apk
          notes=$(cat <<'EOF'
          Debug build of RecipeLens for sideloading on Android.

          **Read before installing**

          * This is a debug build, signed with the throwaway Android debug key. Android
            will warn about installing from an unknown source, and Play Protect may ask
            you to confirm.
          * Each build is signed with a fresh debug key, so installing a newer APK over an
            older one fails with "App not installed". Uninstall the previous RecipeLens
            first. Uninstalling clears the server address and the session on the device;
            your recipes stay on the server.
          * On first launch the app asks for your backend address (for example
            `https://your-service.onrender.com`) and checks it before storing it. You can
            change it later under Settings → Server. Baking an address in at build time is
            still possible with the `api_base_url` input or the `RECIPELENS_API_BASE_URL`
            repository variable, but it is no longer required.
          * The APK contains no AI key and no database credentials — it only calls the
            backend you point it at.

          Built from commit ${{ github.sha }}.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" RecipeLens-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" RecipeLens-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "RecipeLens — Android preview" \
              --notes "$notes"
          fi
          echo "Install link: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/RecipeLens-debug.apk"
