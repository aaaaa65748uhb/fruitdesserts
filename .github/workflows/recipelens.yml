name: RecipeLens — checks & Android APK

on:
  push:
    branches:
      - "claude/recipelens-full-stack-mkrpwi"
      - main
    paths:
      - "recipelens/**"
      - ".github/workflows/recipelens.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend the APK should talk to (VITE_API_BASE_URL)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipelens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recipelens/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: recipelens-web-dist
          path: recipelens/web/dist
          retention-days: 14

  android:
    name: Build Android APK
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipelens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recipelens/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web client
        # VITE_API_BASE_URL tells the APK which backend to call. It is a plain
        # URL, not a secret: the APK holds no AI key and no database credential.
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.RECIPELENS_API_BASE_URL }}
        run: npm run build

      - name: Sync the Capacitor Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: recipelens/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Show what was produced
        working-directory: recipelens/android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: RecipeLens-debug-apk
          path: recipelens/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
