name: Build & Release Android APK

on:
  push:
    branches:
      - "claude/fridgetok-smart-fridge-zh6qv"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy web assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index-standalone.html manifest.json icon.svg sw.js \
             android/app/src/main/assets/
          cp icon-192.png icon-512.png android/app/src/main/assets/

      - name: Generate launcher icons
        run: |
          python3 - <<'PYEOF'
          import struct, zlib, os

          def solid_png(size, r, g, b):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              row = b'\x00' + bytes([r, g, b] * size)
              idat = zlib.compress(row * size)
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', ihdr)
                      + chunk(b'IDAT', idat)
                      + chunk(b'IEND', b''))

          densities = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72,
                       'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, sz in densities.items():
              path = f'android/app/src/main/res/{d}'
              os.makedirs(path, exist_ok=True)
              with open(f'{path}/ic_launcher.png', 'wb') as f:
                  f.write(solid_png(sz, 26, 26, 46))  # #1a1a2e
          PYEOF

      - name: Setup Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version=8.6 --distribution-type=bin

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk fridgetok.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "FridgeTok — הורדת האפליקציה"
          body: |
            ## 📲 הורדת FridgeTok לאנדרואיד

            לחץ על **fridgetok.apk** למטה להורדה ישירה.

            ### איך מתקינים:
            1. הורד את הקובץ לטלפון
            2. פתח את הקובץ — אנדרואיד ישאל על "מקורות לא ידועים"
            3. לחץ **הגדרות → אפשר** → חזור וגע שוב על הקובץ
            4. לחץ **התקן**

            ### איך משתפים מטיקטוק:
            1. לחץ **שתף** על כל סרטון טיקטוק/אינסטגרם
            2. בחר **FridgeTok** מהתפריט
            3. האפליקציה נפתחת ומנתחת מיידית את המתכון 🍳
          files: fridgetok.apk
          make_latest: true
          prerelease: false
