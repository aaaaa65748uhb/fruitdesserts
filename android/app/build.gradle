plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fridgetok'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fridgetok'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
