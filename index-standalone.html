<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{font-family:'Heebo',Arial,sans-serif;direction:rtl;background:linear-gradient(135deg,#e0f2fe,#d1fae5);min-height:100vh;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#f0f9ff;box-shadow:0 0 40px rgba(0,0,0,.15);position:relative}
.page{display:none;padding-bottom:5rem;min-height:100vh}
.page.active{display:block}
.gh{background:linear-gradient(135deg,#0052CC,#0099B0,#00B894);color:#fff;padding:1.25rem 1rem 1.5rem;position:relative;overflow:hidden}
.gh h1{font-size:1.4rem;font-weight:800;margin:0}
.gh p{font-size:.82rem;opacity:.85;margin:.2rem 0 0}
.card{background:#fff;border-radius:1rem;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:1rem}
.btn{border:none;cursor:pointer;font-family:inherit;border-radius:10px;padding:.65rem 1rem;font-weight:700}
.btn-primary{background:linear-gradient(135deg,#0052CC,#0099B0);color:#fff}
.btn-success{background:linear-gradient(135deg,#16A34A,#0D9488);color:#fff}
input,select,textarea{font-family:inherit;direction:rtl;text-align:right;outline:none}
input:focus{border-color:#0052CC!important}
.badge{position:absolute;top:-4px;left:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* Bottom Nav */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #e5e7eb;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:50;display:flex}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem .25rem;gap:2px;cursor:pointer;border:none;background:none;font-family:inherit;color:#6b7280;text-decoration:none;transition:color .2s;position:relative}
.nav-btn.active{color:#0052CC}
.nav-btn span.icon{font-size:1.3rem}
.nav-btn span.label{font-size:.62rem;font-weight:600}
/* Pills */
.pill{padding:.3rem .75rem;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;border:1.5px solid #E5E7EB;background:#fff;color:#374151;white-space:nowrap;font-family:inherit}
.pill.active{background:#0052CC;color:#fff;border-color:#0052CC}
/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid #e5e7eb}
.tab{flex:1;padding:.7rem .5rem;border:none;background:none;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:#6b7280}
.tab.active{color:#0052CC;border-bottom-color:#0052CC}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:1.5rem 1.5rem 0 0;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;padding:1.5rem;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanLine{0%{top:10%}50%{top:85%}100%{top:10%}}
.fade-in{animation:fadeIn .3s}
.scan-line{position:absolute;left:5%;right:5%;height:3px;background:linear-gradient(90deg,transparent,#00ff88,transparent);box-shadow:0 0 10px #00ff88;animation:scanLine 2s ease-in-out infinite}
/* Expiry */
.expiry-critical{background:linear-gradient(135deg,#FEE2E2,#FECACA);border:1px solid #EF4444;border-radius:12px;padding:.65rem .85rem}
.expiry-soon{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border:1px solid #F59E0B;border-radius:12px;padding:.65rem .85rem}
/* progress */
.prog-bar{height:8px;border-radius:999px;background:#E5E7EB;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;transition:width .6s}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
</style>
</head>

<div id="app">

    </div>
  </div>
  <div id="page-tiktok" class="page"></div>
  <div id="page-stats" class="page"></div>

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function navigate(page){
  if(page!=='scanner'){STATE.scanPhotoPreview=null;stopLiveScan();}
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  STATE.currentPage=page;
  renderPage(page);
  updateNavBadges();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>navigate(btn.dataset.page));
});

function updateNavBadges(){
  // shopping badge
  const navShop=document.getElementById('nav-shopping');
  if(navShop){
    navShop.querySelector('.badge')?.remove();
    const unchecked=STATE.shopping.filter(i=>!i.checked).length;
    if(unchecked>0){
      const b=document.createElement('span');b.className='badge';b.textContent=unchecked>9?'9+':unchecked;
      navShop.querySelector('.icon').style.position='relative';
      const wrap=navShop.querySelector('.icon');
      const existing=wrap.querySelector('.badge');if(!existing)wrap.appendChild(b);
    }
  }
  // fridge badge (expiring)
  const navFridge=document.getElementById('nav-fridge');
  if(navFridge){
    navFridge.querySelector('.badge')?.remove();
    const expiring=STATE.fridge.filter(i=>daysUntil(i.exp)<=3).length;
    if(expiring>0){
      const b=document.createElement('span');b.className='badge';b.style.background='#f59e0b';b.textContent=expiring;
      const wrap=navFridge.querySelector('.icon');wrap.style.position='relative';
      const existing=wrap.querySelector('.badge');if(!existing)wrap.appendChild(b);
    }
  }
}

async function handleBarcodePhoto(input){
  const file=input.files?.[0];
  if(!file)return;
  input.value=''; // allow re-selecting same file

  // Show preview immediately
  const fr=new FileReader();
  fr.onload=e=>{STATE.scanPhotoPreview=e.target.result;};
  fr.readAsDataURL(file);

  STATE.scanScanning=true;STATE.scanResult=null;STATE.scanNotFound=false;STATE.scanError=null;
  renderPage('scanner');

  try{
    const bitmap=await createImageBitmap(file);
    let barcode=null;

    // Primary: BarcodeDetector (Chrome/Edge/Android — works on images too)
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e','itf','codabar','qr_code']});
      const codes=await det.detect(bitmap).catch(()=>[]);
      if(codes.length>0) barcode=codes[0].rawValue;
    }

    if(barcode){
      STATE.scanBarcode=barcode;
      STATE.scanPhotoPreview=null;
      doScan();
    }else{
      STATE.scanScanning=false;
      STATE.scanError='לא זוהה ברקוד — נסה לצלם מקרוב יותר ובאור טוב, ולוודא שהברקוד חד ומרכזי. או הזן ידנית:';
      renderPage('scanner');
      // Focus manual input
      setTimeout(()=>{const i=document.getElementById('scan-input');if(i)i.focus();},100);
    }
  }catch(e){
    STATE.scanScanning=false;
    STATE.scanError='שגיאה בעיבוד התמונה: '+(e.message||e.name);
    renderPage('scanner');
  }
}

function stopCamera(){stopLiveScan();}

// ─── LIVE CAMERA BARCODE SCANNER ─────────────────────────────────────────────
let _scanStream=null,_scanRaf=null,_scanDet=null;

async function startLiveScan(){
  const overlay=document.getElementById('live-scanner-overlay');
  if(!overlay)return;
  if(!navigator.mediaDevices?.getUserMedia){
    STATE.scanError='המצלמה החיה אינה נתמכת בדפדפן זה — נסה לצלם תמונה';
    renderPage('scanner');return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    _scanStream=stream;
    const video=document.getElementById('scan-video');
    video.srcObject=stream;
    await video.play().catch(()=>{});
    overlay.style.display='flex';
    if('BarcodeDetector' in window){
      _scanDet=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e','itf','codabar','qr_code']});
      _scanRaf=requestAnimationFrame(_liveScanLoop);
    }else{
      const s=document.getElementById('scan-live-status');
      if(s)s.textContent='BarcodeDetector לא נתמך — הגרסה ישנה מדי';
    }
  }catch(e){
    STATE.scanError='לא ניתן לגשת למצלמה: '+(e.message||e.name||'שגיאה לא ידועה')+'. נסה לצלם תמונה';
    renderPage('scanner');
  }
}

async function _liveScanLoop(){
  if(!_scanStream)return;
  const video=document.getElementById('scan-video');
  if(video&&video.readyState>=2&&_scanDet){
    try{
      const codes=await _scanDet.detect(video);
      if(codes.length>0){
        const bc=codes[0].rawValue;
        stopLiveScan();
        STATE.scanBarcode=bc;
        doScan();
        return;
      }
    }catch(e){}
  }
  _scanRaf=requestAnimationFrame(_liveScanLoop);
}

function stopLiveScan(){
  if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}
  if(_scanRaf){cancelAnimationFrame(_scanRaf);_scanRaf=null;}
  _scanDet=null;
  const overlay=document.getElementById('live-scanner-overlay');
  if(overlay)overlay.style.display='none';
}

  const s=(tags||[]).join(' ').toLowerCase();
  for(const[k,v]of Object.entries(CAT_EMOJI)){if(s.includes(k))return v;}

function mockPricesForExternal(baseName){
  // מחיר בסיס אקראי-קבוע לפי שם (reproducible)
  let seed=0;for(let i=0;i<baseName.length;i++)seed+=baseName.charCodeAt(i);
  const base=8+(seed%25);
  return{
    shufersal:+(base+2.5).toFixed(2),ramiLevy:+(base*0.83).toFixed(2),
    yochananof:+(base+1.2).toFixed(2),victory:+(base+0.8).toFixed(2),
    carrefour:+(base+2.0).toFixed(2),osherAd:+(base*0.88).toFixed(2),
    tivTaam:+(base+1.5).toFixed(2),haziHinam:+(base*0.80).toFixed(2),
  };
}

function renderScanResult(p, source){

  const hasNutrition = p.cal||p.pro||p.carb||p.fat;
  const pid = p.id.startsWith('off_') ? encodeURIComponent(p.id) : p.id;
  return`<div class="card slide-up" style="margin-bottom:.75rem">
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:.85rem">
      <span style="font-size:3rem;flex-shrink:0">${p.img}</span>

        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${p.kosher?`<span style="background:#DCFCE7;color:#16A34A;font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:999px">✓ ${p.kosher}</span>`:''}
          ${sourceBadge}
        </div>
      </div>
    </div>

    ${hasNutrition?`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-bottom:.85rem">
      ${[['🔥',p.cal||'—','קל׳'],['💪',p.pro||'—','חלבון'],['🌾',p.carb||'—','פחמ׳'],['🥑',p.fat||'—','שומן']].map(([e,v,l])=>`
        <div style="background:#F9FAFB;border-radius:8px;padding:.4rem;text-align:center">
          <div style="font-size:.85rem;font-weight:800">${v}${typeof v==='number'?'ג':''}</div>

    <div style="background:#F0F9FF;border-radius:10px;padding:.65rem;margin-bottom:.85rem">
      <div style="font-size:.75rem;color:#6b7280;margin-bottom:.4rem;font-weight:600">💰 השוואת מחירים ב-8 רשתות</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem">
        ${STORES.slice(0,4).map(s=>{const pr=p.prices[s.id];const best=pr===minPrice(p);return`<div style="text-align:center;padding:.3rem .1rem;border-radius:6px;background:${best?'#DCFCE7':'white'}">
          <div style="font-size:.62rem;color:#6b7280">${s.name}</div>
          <div style="font-size:.82rem;font-weight:800;color:${best?'#16A34A':'#374151'}">₪${pr}</div>
          ${best?'<div style="font-size:.58rem;color:#16A34A;font-weight:700">הזול!</div>':''}
        </div>`}).join('')}
      </div>
      <div style="font-size:.72rem;color:#16A34A;font-weight:700;margin-top:.4rem;text-align:center">
        💚 הכי זול: ₪${minPrice(p)} ב${minStore(p)} &nbsp;|&nbsp; חסכון: ₪${(Math.max(...Object.values(p.prices))-minPrice(p)).toFixed(2)}

      ${source==='openfoodfacts'?`<div style="font-size:.65rem;color:#9ca3af;text-align:center;margin-top:.3rem">* מחירים מוערכים — נתונים מדויקים מחייבים API שקיפות מחירים ממשלת ישראל</div>`:''}

    <div style="display:flex;gap:.4rem;margin-bottom:.4rem">

  const minTotal=unchecked.reduce((s,i)=>{const p=getP(i.pid);return s+(p?minPrice(p)*i.qty:0)},0);

  return`<div class="gh" style="padding:1rem 1rem 1.5rem;background:linear-gradient(135deg,#16A34A,#0D9488)">
    <div style="display:flex;justify-content:space-between;align-items:center">

      ${checked.length>0?`<button onclick="clearChecked()" style="background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:.45rem .75rem;color:#fff;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer">נקה שהושלמו</button>`:''}

      <div id="shop-results" style="display:none;position:absolute;top:100%;right:0;left:0;z-index:50;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);border:1px solid #E5E7EB;margin-top:4px"></div>
    </div>
    ${unchecked.length===0&&checked.length===0?`<div style="text-align:center;padding:3rem 1rem;color:#9ca3af"><div style="font-size:3rem;margin-bottom:.75rem">🛒</div><div style="font-weight:700">הרשימה ריקה</div></div>`:''}
    ${Object.entries(groups).map(([cat,items])=>`
      <div style="margin-bottom:.75rem">
        <div style="font-size:.78rem;font-weight:700;color:#6b7280;margin-bottom:.35rem;padding-right:.25rem">${cat}</div>
        ${items.map(item=>{const p=getP(item.pid);if(!p)return'';const best=minStore(p);const price=minPrice(p);
          return`<div class="card fade-in" style="margin-bottom:.4rem;padding:.65rem .85rem;display:flex;align-items:center;gap:10px">
            <button onclick="toggleShop('${item.id}')" style="width:22px;height:22px;flex-shrink:0;border-radius:6px;border:2px solid #D1D5DB;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"></button>
            <span style="font-size:1.4rem;flex-shrink:0">${p.img}</span>
            <div style="flex:1"><div style="font-size:.85rem;font-weight:700">${h(p.name)}</div><div style="font-size:.72rem;color:#16A34A;font-weight:600">₪${price} ב${best}</div></div>
            <span style="font-weight:800;font-size:.9rem">×${item.qty}</span>
            <button onclick="removeShop('${item.id}')" style="background:none;border:none;cursor:pointer;color:#D1D5DB;font-size:.9rem">✕</button>
          </div>`}).join('')}
      </div>
    `).join('')}
    ${checked.length>0?`<div style="margin-bottom:5rem">
      <div style="font-size:.78rem;font-weight:700;color:#9ca3af;margin-bottom:.35rem">✓ הושלמו (${checked.length})</div>
      ${checked.map(item=>{const p=getP(item.pid);if(!p)return'';
        return`<div class="card" style="margin-bottom:.35rem;padding:.55rem .85rem;display:flex;align-items:center;gap:10px;opacity:.55">

          <span style="font-size:1.2rem">${p.img}</span><span style="font-size:.82rem;text-decoration:line-through;color:#6b7280">${h(p.name)}</span>
          <button onclick="removeShop('${item.id}')" style="margin-right:auto;background:none;border:none;cursor:pointer;color:#D1D5DB;font-size:.85rem">✕</button>

// ─── PRICES ──────────────────────────────────────────────────────────────────
function renderPrices(){
  const search=STATE.priceSearch||'';
  const basket=STATE.basket||[];
  const results=search?PRODUCTS.filter(p=>p.name.includes(search)||p.brand.includes(search)).slice(0,5):PRODUCTS.slice(0,5);

  const basketTotals=STORES.map(s=>({...s,total:basket.reduce((sum,pid)=>{const p=getP(pid);return sum+(p?p.prices[s.id]||0:0)},0)})).sort((a,b)=>a.total-b.total);

  return`<div class="gh" style="padding:1rem 1rem 1.5rem;background:linear-gradient(135deg,#7C3AED,#0052CC)"><h1>💰 השוואת מחירים</h1><p>8 רשתות מזון בישראל</p></div>
  <div style="padding:.75rem;padding-bottom:5rem">
    <input value="${h(search)}" oninput="STATE.priceSearch=this.value;renderPage('prices')" placeholder="🔍 חפש מוצר להשוואה..." style="width:100%;padding:.65rem .85rem;border-radius:12px;border:1.5px solid #E5E7EB;font-size:.88rem;margin-bottom:.75rem;background:#fff"/>
    ${results.map(p=>{
      const prices=Object.entries(p.prices);
      const min=Math.min(...prices.map(([,v])=>v));
      const max=Math.max(...prices.map(([,v])=>v));
      const inBasket=basket.includes(p.id);
      return`<div class="card fade-in" style="margin-bottom:.5rem;padding:.75rem">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:.65rem">
          <span style="font-size:1.5rem">${p.img}</span>
          <div><div style="font-weight:700;font-size:.88rem">${h(p.name)}</div><div style="font-size:.72rem;color:#6b7280">${h(p.brand)} · ${p.w}${p.unit}</div></div>
          <div style="margin-right:auto;display:flex;gap:.35rem">
            <button onclick="toggleBasket('${p.id}')" style="padding:.3rem .6rem;border-radius:8px;border:1.5px solid ${inBasket?'#16A34A':'#0052CC'};background:${inBasket?'#DCFCE7':'#fff'};color:${inBasket?'#16A34A':'#0052CC'};font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer">${inBasket?'✓ בסל':'+ סל'}</button>
            <button onclick="addToShopFromPrices('${p.id}')" style="padding:.3rem .6rem;border-radius:8px;border:1.5px solid #16A34A;background:#fff;color:#16A34A;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer">🛒</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem">
          ${STORES.slice(0,4).map(s=>{const price=p.prices[s.id];const isBest=price===min;const isWorst=price===max;
            return`<div style="text-align:center;padding:.4rem .2rem;border-radius:8px;background:${isBest?'#DCFCE7':isWorst?'#FEE2E2':'#F9FAFB'};border:${isBest?'1.5px solid #16A34A':isWorst?'1.5px solid #EF4444':'1px solid #F3F4F6'}">
              <div style="font-size:.65rem;color:#6b7280;margin-bottom:.15rem">${s.name}</div>
              <div style="font-size:.85rem;font-weight:800;color:${isBest?'#16A34A':isWorst?'#DC2626':'#374151'}">₪${price}</div>
              ${isBest?'<div style="font-size:.6rem;color:#16A34A;font-weight:700">הכי זול!</div>':''}
            </div>`}).join('')}
        </div>
        <div style="font-size:.72rem;color:#6b7280;margin-top:.4rem;text-align:center">חסכון מקסימלי: <span style="color:#16A34A;font-weight:700">₪${(max-min).toFixed(2)}</span></div>
      </div>`}).join('')}

    ${basket.length>0?`<div style="margin-top:1rem">
      <div style="font-size:.88rem;font-weight:700;color:#374151;margin-bottom:.5rem">🛒 סל קניות (${basket.length} מוצרים)</div>
      ${basketTotals.filter(s=>s.total>0).map((s,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:.65rem .85rem;border-radius:12px;margin-bottom:.4rem;background:${i===0?'#DCFCE7':'#fff'};border:${i===0?'1.5px solid #16A34A':'1px solid #F3F4F6'}">
          <span style="font-size:1.2rem">${s.logo}</span>
          <span style="flex:1;font-weight:${i===0?700:500};font-size:.88rem">${s.name} ${i===0?'🏆':''}</span>
          <span style="font-weight:800;font-size:1rem;color:${i===0?'#16A34A':'#374151'}">₪${s.total.toFixed(2)}</span>
        </div>
      `).join('')}
    </div>`:''}
  </div>`;
}

// Scan — 3-tier lookup:
// 1. Local Israeli mock DB (instant)
// 2. Open Food Facts API (free, CORS-enabled, real barcodes)
// 3. Not found
// Note: chp.co.il has no public API (consumer site only)
// Israeli price data: government XML via supermarket chains; mocked here deterministically

async function doScan(){
  const bc=STATE.scanBarcode.trim();if(!bc)return;
  STATE.scanScanning=true;STATE.scanResult=null;STATE.scanNotFound=false;STATE.scanError=null;STATE.scanSource=null;
  renderPage('scanner');
  // Tier 1: local mock DB
  const local=PRODUCTS.find(p=>p.barcode===bc);
  if(local){
    STATE.scanScanning=false;STATE.scanResult=local;STATE.scanSource='local';
    renderPage('scanner');return;
  }
  // Tier 2: Open Food Facts
  try{
    const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+bc+'.json',{signal:AbortSignal.timeout(8000)});
    const data=await res.json();
    if(data.status===1&&data.product){
      const p=data.product;
      const name=p.product_name_he||p.product_name||p.abbreviated_product_name||'מוצר לא ידוע';
      const brand=p.brands||'';
      const offProduct={
        id:'off_'+bc,barcode:bc,name,brand,
        cat:p.categories||'',w:p.quantity||'',unit:'',img:guessEmoji(p.categories_tags||[]),
        kosher:(p.labels_tags||[]).some(t=>t.includes('kosher'))?'כשר':null,
        cal:Math.round(p.nutriments?.['energy-kcal_100g']||0),
        pro:+(p.nutriments?.proteins_100g||0).toFixed(1),
        carb:+(p.nutriments?.carbohydrates_100g||0).toFixed(1),
        fat:+(p.nutriments?.fat_100g||0).toFixed(1),
        isExternal:true,prices:mockPricesForExternal(name)
      };
      // cache externally-fetched product so addScannedToFridge works
      if(!STATE.externalProducts)STATE.externalProducts={};
      STATE.externalProducts[offProduct.id]=offProduct;
      save();
      STATE.scanScanning=false;STATE.scanResult=offProduct;STATE.scanSource='openfoodfacts';
      renderPage('scanner');return;
    }
  }catch(e){
    if(e.name!=='AbortError')STATE.scanError='שגיאת רשת — בדוק חיבור אינטרנט';
  }
  STATE.scanScanning=false;STATE.scanNotFound=true;
  renderPage('scanner');
}
function scanDemo(bc){STATE.scanBarcode=bc;doScan()}
function addScannedToFridge(pid,loc){
  // support both local products and externally-fetched ones
  let p=getP(pid);
  if(!p&&STATE.externalProducts)p=STATE.externalProducts[pid];
  if(!p)return;
  // for external products add to fridge with full product data embedded
  const existing=STATE.fridge.find(i=>i.pid===pid&&i.loc===loc);
  if(existing)existing.qty++;
  else STATE.fridge.push({id:uid(),pid,loc,qty:1,ext:pid.startsWith('off_')?p:null,exp:new Date(Date.now()+(loc==='freezer'?90:loc==='pantry'?180:7)*864e5).toISOString()});
  save();STATE.scanResult=null;STATE.scanBarcode='';renderPage('scanner');
  alert('✓ נוסף ל'+{fridge:'מקרר',pantry:'מזווה',freezer:'מקפיא'}[loc]+'!');
}
function addScannedToShopping(pid){
  const existing=STATE.shopping.find(i=>i.pid===pid);
  if(existing)existing.qty++;else STATE.shopping.push({id:uid(),pid,qty:1,checked:false});
  save();updateNavBadges();alert('✓ נוסף לרשימת הקניות!');
}

        <button onclick="addModalQty.textContent=Math.max(1,+addModalQty.textContent-1)" style="width:36px;height:36px;border-radius:50%;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;font-size:1.2rem">−</button>

        <button onclick="addModalQty.textContent=+addModalQty.textContent+1" style="width:36px;height:36px;border-radius:50%;border:1.5px solid #0052CC;background:#EEF2FF;cursor:pointer;font-size:1.2rem;color:#0052CC">+</button>

    <div style="margin-bottom:1rem">
      <label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:.4rem">תאריך תפוגה (אופציונלי)</label>

    <button onclick="confirmAdd('${selected.id}')" style="width:100%;padding:.85rem;background:linear-gradient(135deg,#0052CC,#0099B0);border:none;border-radius:14px;color:#fff;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer">הוסף למקרר ✓</button>`;
    STATE._addLoc='fridge';selectLoc('fridge');
    return;
  }
  const results=search?PRODUCTS.filter(p=>p.name.includes(search)||p.brand.includes(search)||p.barcode.includes(search)).slice(0,10):PRODUCTS.slice(0,8);
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h2 style="margin:0;font-size:1.1rem;font-weight:800">הוסף מוצר</h2>
    <button onclick="closeAddModal()" style="background:none;border:none;cursor:pointer;font-size:1.5rem;color:#6b7280">✕</button>
  </div>
  <input value="${h(search)}" oninput="renderAddModal(document.getElementById('modal-add-content'),this.value)" placeholder="🔍 חפש מוצר..." style="width:100%;padding:.7rem .9rem;border:1px solid #e5e7eb;border-radius:12px;font-size:.9rem;margin-bottom:.75rem" autofocus/>
  <div style="max-height:300px;overflow-y:auto">
    ${results.map(p=>`<div onclick="renderAddModal(document.getElementById('modal-add-content'),'',${JSON.stringify(p).replace(/"/g,'&quot;')})" style="display:flex;align-items:center;gap:10px;padding:.65rem;border-radius:10px;cursor:pointer;margin-bottom:.3rem;border:1px solid #f3f4f6" onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background=''">
      <span style="font-size:1.6rem">${p.img}</span>
      <div><div style="font-weight:700;font-size:.85rem">${h(p.name)}</div><div style="font-size:.72rem;color:#6b7280">${h(p.brand)} · ${p.cat}</div></div>
    </div>`).join('')}
  </div>`;
}
function selectLoc(loc){
  STATE._addLoc=loc;
  document.querySelectorAll('[id^="loc-"]').forEach(b=>{
    b.style.border='1.5px solid #e5e7eb';b.style.background='#fff';b.style.color='#374151';
  });
  const btn=document.getElementById('loc-'+loc);
  if(btn){btn.style.border='2px solid #0052CC';btn.style.background='#EEF2FF';btn.style.color='#0052CC'}
}
function closeAddModal(){document.getElementById('modal-add').classList.remove('open')}
function confirmAdd(pid){
  const p=getP(pid);if(!p)return;
  const loc=STATE._addLoc||'fridge';
  const qty=parseInt(document.getElementById('addModalQty')?.textContent)||1;
  const expEl=document.getElementById('addModalExp');
  const exp=expEl?.value?new Date(expEl.value).toISOString():new Date(Date.now()+(loc==='freezer'?90:loc==='pantry'?180:7)*864e5).toISOString();
  const existing=STATE.fridge.find(i=>i.pid===pid&&i.loc===loc);
  if(existing)existing.qty+=qty;else STATE.fridge.push({id:uid(),pid,loc,qty,exp});
  save();closeAddModal();renderPage('fridge');updateNavBadges();
}

document.getElementById('modal-add').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAddModal()});
document.getElementById('modal-recipe').addEventListener('click',e=>{if(e.target===e.currentTarget)document.getElementById('modal-recipe').classList.remove('open')});

// TikTok
const TT_DATA=[
  {name:'שקשוקה מסורתית',emoji:'🍳',color:'#FF6B6B',time:25,cal:280,ing:['ביצים × 4','עגבניות שרי 250ג','שמן זית 3כ','שום 3 שיניים','פפריקה 1כ'],steps:['מחממים שמן ומטגנים שום.','מוסיפים עגבניות ומבשלים 10 דקות.','שוברים ביצים לרוטב.','מבשלים 8 דקות.']},
  {name:'פסטה שמנת פטריות',emoji:'🍝',color:'#FF8E53',time:20,cal:480,ing:['פסטה 400ג','שמנת 200מ"ל','פטריות 200ג','גבינה 80ג','שום 2 שיניים'],steps:['מבשלים פסטה.','מטגנים פטריות ושום.','מוסיפים שמנת וגבינה.','מערבבים עם פסטה.']},
  {name:'עוגת שוקולד 3 מרכיבים',emoji:'🎂',color:'#4F46E5',time:40,cal:420,ing:['שוקולד מריר 200ג','ביצים × 4','סוכר 150ג'],steps:['ממיסים שוקולד.','מקציפים ביצים וסוכר.','מאחדים ואופים.']},
];
function analyzeTikTokDemo(id){
  STATE.tiktokLoading=true;STATE.tiktokResult=null;STATE.ttError=null;renderPage('tiktok');
  setTimeout(()=>{STATE.tiktokLoading=false;STATE.tiktokResult=TT_DATA[id-1];renderPage('tiktok')},1800);
}

function saveApiKey(){
  const k=(document.getElementById('api-key-input')?.value||'').trim();
  if(k.startsWith('gsk_')){
    localStorage.setItem('ai_api_key',k);localStorage.setItem('ai_api_type','groq');
  }else if(k.startsWith('AIza')){
    localStorage.setItem('ai_api_key',k);localStorage.setItem('ai_api_type','gemini');
  }else{
    return alert('מפתח לא תקין\n\nGroq: מתחיל ב-gsk_\nGemini: מתחיל ב-AIza');
  }
  renderPage('tiktok');
}
function clearApiKey(){
  localStorage.removeItem('ai_api_key');localStorage.removeItem('ai_api_type');
  renderPage('tiktok');
}

async function analyzeTikTok(){
  const url=(document.getElementById('tt-url')?.value||STATE.ttUrl||'').trim();
  if(!url){alert('הדבק קישור לסרטון');return;}
  STATE.ttUrl=url;

  const apiKey=localStorage.getItem('ai_api_key')||'';
  const apiType=localStorage.getItem('ai_api_type')||'groq';

  STATE.tiktokLoading=true;STATE.tiktokResult=null;STATE.ttError=null;
  STATE.ttStep='מאחזר מידע על הסרטון...';
  renderPage('tiktok');

  // Step 1: fetch oEmbed metadata (best-effort, CORS may block)
  let platform='סרטון',title='',author='';
  if(url.includes('tiktok.com'))platform='TikTok';
  else if(url.includes('instagram.com'))platform='Instagram';
  else if(url.includes('youtube.com')||url.includes('youtu.be'))platform='YouTube';
  else if(url.includes('facebook.com')||url.includes('fb.watch'))platform='Facebook';

  try{
    let oembed='';
    if(platform==='TikTok')oembed=`https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`;
    else if(platform==='YouTube')oembed=`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    if(oembed){
      const r=await fetch(oembed,{signal:AbortSignal.timeout(5000)});
      const d=await r.json();
      title=d.title||'';author=d.author_name||'';
    }
  }catch(e){}

  const aiName=apiKey?(apiType==='gemini'?'Gemini Flash':'Groq Llama 3'):'Pollinations AI';
  STATE.ttStep=`שולח ל-${aiName}${title?' — "'+title+'"':''}...`;
  const stepEl=document.getElementById('tt-step');if(stepEl)stepEl.textContent=STATE.ttStep;

  const prompt=`אתה שף מקצועי המתמחה בחילוץ מתכונים מסרטוני בישול.

פרטי הסרטון:
- פלטפורמה: ${platform}
- קישור: ${url}${title?`\n- כותרת: "${title}"`:''}${author?`\n- יוצר: ${author}`:''}

**המשימה:** חלץ את המתכון המלא מהסרטון הזה. אם אתה מזהה את המתכון מהכותרת — השתמש בידע שלך עליו. אחרת, צור מתכון ישראלי קלאסי שמתאים לנושא.

הוראות:
- כתוב הכל בעברית
- כמויות מדויקות ומציאותיות
- שלבי הכנה ברורים ומפורטים
- טיפ שף אחד שימושי

החזר **JSON בלבד** (ללא טקסט נוסף לפני או אחרי):
{"name":"שם המתכון","prepTime":10,"cookTime":20,"servings":4,"difficulty":"קל","ingredients":[{"name":"מצרך","amount":"כמות","unit":"יחידה"}],"steps":["שלב 1 מפורט","שלב 2 מפורט"],"tips":"טיפ שף","nutrition":{"calories":350,"protein":20,"carbs":40,"fat":12}}`;

  try{
    let text='';
    if(apiKey&&apiType==='gemini'){
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1800,temperature:0.3}}),
        signal:AbortSignal.timeout(30000)
      });
      if(!resp.ok){const err=await resp.json();throw new Error(err.error?.message||`שגיאת Gemini ${resp.status}`);}
      const data=await resp.json();
      text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
      if(!text)throw new Error('תגובת Gemini ריקה — נסה שוב');
    }else if(apiKey&&apiType==='groq'){
      const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
        body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:1800,temperature:0.3,messages:[{role:'user',content:prompt}]}),
        signal:AbortSignal.timeout(30000)
      });
      if(!resp.ok){const err=await resp.json();throw new Error(err.error?.message||`שגיאת Groq ${resp.status}`);}
      const data=await resp.json();
      text=data.choices?.[0]?.message?.content||'';
      if(!text)throw new Error('תגובת Groq ריקה — נסה שוב');
    }else{
      // Free, no-key AI via Pollinations.ai
      const resp=await fetch('https://text.pollinations.ai/openai',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'openai',messages:[{role:'user',content:prompt}],seed:42,private:true}),
        signal:AbortSignal.timeout(45000)
      });
      if(!resp.ok)throw new Error(`שגיאת Pollinations ${resp.status} — נסה שוב`);
      const data=await resp.json();
      text=data.choices?.[0]?.message?.content||'';
      if(!text)throw new Error('תגובת AI ריקה — נסה שוב');
    }
    const m=text.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('תגובת AI לא תקינה — נסה שוב');
    const recipe=JSON.parse(m[0]);
    STATE.tiktokLoading=false;STATE.tiktokResult=recipe;
    renderPage('tiktok');
  }catch(e){
    STATE.tiktokLoading=false;
    STATE.ttError=e.message||'שגיאה לא ידועה';
    renderPage('tiktok');
  }
}

function ttAddToShopping(){
  const tt=STATE.tiktokResult;if(!tt)return;
  const items=tt.ingredients||tt.ing||[];
  let added=0;
  items.forEach(ing=>{
    const name=typeof ing==='string'?ing.split(' ')[0]:ing.name;
    const p=PRODUCTS.find(x=>x.name.includes(name)||name.includes(x.name.split(' ')[0]));
    if(p){const ex=STATE.shopping.find(i=>i.pid===p.id);if(ex)ex.qty++;else STATE.shopping.push({id:uid(),pid:p.id,qty:1,checked:false});added++;}
  });
  save();updateNavBadges();
  alert(added>0?`נוספו ${added} מוצרים לרשימת הקניות!`:'המוצרים לא נמצאו במאגר — נסה להוסיף ידנית.');
}

function ttSaveRecipe(){
  const tt=STATE.tiktokResult;if(!tt||!tt.ingredients)return;
  if(!STATE.savedRecipes)STATE.savedRecipes=[];
  STATE.savedRecipes.push({...tt,id:'sr'+Date.now()});
  save();alert('✓ המתכון נשמר!');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateNavBadges();
renderPage('home');

// ─── PWA / SHARE TARGET ───────────────────────────────────────────────────
function _extractVideoUrl(text){
  if(!text)return'';
  const m=text.match(/https?:\/\/(www\.)?(tiktok\.com|vm\.tiktok\.com|vt\.tiktok\.com|instagram\.com|youtube\.com|youtu\.be|facebook\.com|fb\.watch|m\.facebook\.com)[^\s<"]*/i);
  return m?m[0]:'';
}

function handleShareTarget(){
  const p=new URLSearchParams(location.search);
  const sharedUrl=p.get('url')||'';
  const sharedText=p.get('text')||'';
  const sharedTitle=p.get('title')||'';
  const page=p.get('page')||'';

  const videoUrl=sharedUrl||_extractVideoUrl(sharedText)||_extractVideoUrl(sharedTitle);

  if(videoUrl){
    STATE.ttUrl=videoUrl;
    history.replaceState({},'',location.pathname);
    navigate('tiktok');
    const apiKey=localStorage.getItem('ai_api_key');
    if(apiKey){
      STATE.tiktokLoading=true;STATE.tiktokResult=null;STATE.ttError=null;
      STATE.ttStep='מנתח סרטון שהתקבל...';
      renderPage('tiktok');
      setTimeout(()=>analyzeTikTok(),400);
    }
  }else if(page){
    history.replaceState({},'',location.pathname);
    navigate(page);
  }
}

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// Handle share on load
handleShareTarget();
</script>
