# One-click deploy for the RecipeLens backend (https://render.com).
#
# In Render: New → Blueprint → pick this repository → pick the branch. Render
# reads this file, creates the service and generates SESSION_SECRET for you.
#
# Nothing here needs to be filled in by hand, so the blueprint applies straight
# away. AI analysis stays switched off until you add AI_API_KEY in the Render
# dashboard (Environment → Add Environment Variable); everything else — sign-in,
# recipes, scaling, shopping list, cooking mode — works without it.
#
# The service serves the API *and* the built web client, so the URL Render gives
# you works in a phone browser as well as being the address to build the APK
# against.
services:
  - type: web
    name: recipelens
    runtime: node
    plan: free
    rootDir: recipelens
    # --include=dev because the build and the TypeScript runtime live in
    # devDependencies; Render sets NODE_ENV=production, which would omit them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Signs session cookies. Render generates it once and keeps it.
      - key: SESSION_SECRET
        generateValue: true
      # SQLite lives on the instance disk. On the free plan that disk is wiped
      # when the service restarts or redeploys, so treat the data as temporary.
      - key: DATABASE_URL
        value: file:./data/recipelens.db
      # --- AI: NVIDIA Build (NIM) -------------------------------------------
      # AI_API_KEY is deliberately NOT here: add it in the dashboard so the
      # secret never lives in the repository. Everything else is public config.
      # Supported AI_PROVIDER values:
      #   nvidia | openai | openai-compatible | anthropic | gemini
      - key: AI_PROVIDER
        value: nvidia
      - key: AI_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      # Which model to use is an operator's choice, not the repository's, so it
      # is deliberately NOT given a value here: Render re-syncs blueprint values
      # on every deploy, and a value here would overwrite the one you set in the
      # dashboard the next time this file changes.
      #
      # Set it under Environment in the Render dashboard. It must name a model
      # your key can currently use — vendors retire models on a schedule, and a
      # retired one answers HTTP 410 however correct everything else is.
      # Settings → Test AI connection lists what the key can use right now.
      - key: AI_MODEL
        sync: false
      # How long one analysis may take in total, attempts included. A 120B-class
      # model writing a whole recipe can need minutes; the tiny connection check
      # is no guide to that. Lower it only if you also move to a smaller model.
      - key: AI_TOTAL_BUDGET_MS
        value: "210000"
      # Upper bound for a single call. Each attempt gets whatever is left of the
      # budget, up to this — a ceiling below what the model needs would fail
      # every attempt at the same point, and no retry could rescue it.
      - key: AI_TIMEOUT_MS
        value: "180000"
