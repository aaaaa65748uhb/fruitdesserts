<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ChefTok 🧑‍🍳 — עוזר הבישול בידיים חופשיות</title>
<link rel="manifest" href="manifest-cheftok.json">
<meta name="theme-color" content="#ff4757">
<meta name="description" content="הופכים סרטוני בישול קצרים למתכון אינטראקטיבי בשליטת קול ומחוות — בלי לגעת במסך">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChefTok">
<link rel="apple-touch-icon" href="cheftok-icon.svg">
<link rel="icon" href="cheftok-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{
    --coral:#ff4757; --coral2:#ff6b6b; --coral3:#ff7f50;
    --green:#2ed573; --amber:#ffa502;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{font-family:'Heebo',Arial,sans-serif;direction:rtl}
  body{min-height:100vh;background:var(--bg);color:var(--text);transition:background .3s,color .3s}

  /* ערכות נושא — מצב תאורת מטבח */
  body[data-theme="light"]{
    --bg:#fff8f6; --panel:#ffffff; --card:#fff1ee; --text:#1e293b;
    --sub:#64748b; --border:#ffd9d0; --track:#e2e8f0;
  }
  body[data-theme="dark"]{
    --bg:#020617; --panel:#0f172a; --card:#1e293b; --text:#f8fafc;
    --sub:#94a3b8; --border:#334155; --track:#334155;
  }

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit;direction:rtl;text-align:right;outline:none}
  .tnum{font-variant-numeric:tabular-nums}
  .app{min-height:100vh;display:flex;flex-direction:column}

  /* ===== מסך הבית ===== */
  .home-head{background:linear-gradient(120deg,var(--coral),var(--coral2),var(--coral3));color:#fff;
    padding:34px 20px 44px;border-radius:0 0 36px 36px;box-shadow:0 12px 30px rgba(255,71,87,.25);position:relative;overflow:hidden}
  .home-head .ghost{position:absolute;top:-30px;left:-20px;font-size:170px;opacity:.15}
  .home-row{display:flex;align-items:center;justify-content:space-between;position:relative}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .e{font-size:40px}
  .logo h1{font-size:38px;font-weight:900;letter-spacing:-1px}
  .home-sub{font-size:20px;font-weight:500;margin-top:12px;opacity:.96;position:relative;max-width:640px}
  .chip-btn{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:999px;padding:9px 16px;font-size:18px;font-weight:700}

  .home-main{padding:0 20px 110px;max-width:760px;margin:0 auto;width:100%}
  .input-card{background:var(--panel);border:2px solid var(--border);border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:18px;margin-top:-22px;position:relative}
  .input-label{font-size:18px;font-weight:700;color:var(--sub);display:block;margin-bottom:8px}
  .url-input{width:100%;border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:18px;padding:14px 16px;font-size:18px;font-weight:500;transition:border-color .2s}
  .url-input:focus{border-color:var(--coral)}
  .start-btn{margin-top:14px;width:100%;background:linear-gradient(90deg,var(--coral),var(--coral2));color:#fff;border-radius:18px;
    padding:18px;font-size:24px;font-weight:900;box-shadow:0 10px 24px rgba(255,71,87,.32);transition:transform .12s}
  .start-btn:active{transform:scale(.98)}

  .sec-row{display:flex;align-items:center;justify-content:space-between;margin:32px 0 14px}
  .sec-row h2{font-size:26px;font-weight:800}
  .sec-row span{font-size:16px;font-weight:700;color:var(--sub)}

  .recipe-card{display:flex;width:100%;text-align:right;background:var(--panel);border:2px solid var(--border);
    border-radius:26px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.07);margin-bottom:16px;transition:transform .12s}
  .recipe-card:active{transform:scale(.99)}
  .thumb{width:120px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
  .thumb .e{font-size:62px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
  .thumb .steps{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
  .r-body{flex:1;padding:14px}
  .r-badge{display:inline-block;background:rgba(255,71,87,.12);color:var(--coral);font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:6px}
  .r-body h3{font-size:21px;font-weight:800;line-height:1.15}
  .r-chef{font-size:16px;color:var(--sub);font-weight:500;margin-top:4px}
  .r-meta{display:flex;gap:12px;font-size:16px;font-weight:700;color:var(--sub);margin-top:8px}

  /* ===== מסך בישול ===== */
  .top-bar{background:linear-gradient(90deg,var(--coral),var(--coral2));color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 14px rgba(255,71,87,.3)}
  .top-bar .x{font-size:26px;font-weight:700}
  .live{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.2);padding:7px 14px;border-radius:999px;font-size:17px;font-weight:800}
  .live .dot{width:13px;height:13px;border-radius:50%;background:var(--green);animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(46,213,115,.7)}50%{opacity:.3;box-shadow:0 0 0 7px rgba(46,213,115,0)}}

  .progress-wrap{background:var(--panel);border-bottom:2px solid var(--border);padding:12px 16px}
  .progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .progress-top .title{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress-top .count{font-size:19px;font-weight:900;color:var(--coral);flex-shrink:0;margin-right:10px}
  .bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--green));transition:width .5s}
  .dots{display:flex;justify-content:space-between;margin-top:9px}
  .dot-step{width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);background:var(--card);color:var(--sub);transition:all .2s}
  .dot-step.done{background:var(--green);color:#fff;border-color:var(--green)}
  .dot-step.cur{background:var(--coral);color:#fff;border-color:var(--coral);transform:scale(1.12);box-shadow:0 4px 12px rgba(255,71,87,.4)}

  .cook-body{flex:1;display:grid;grid-template-columns:1fr;gap:16px;padding:16px;align-content:start}
  @media(min-width:900px){.cook-body{grid-template-columns:1fr 1fr;max-width:1300px;margin:0 auto;width:100%}}

  /* נגן וידאו */
  .video{position:relative;min-height:240px;border-radius:26px;overflow:hidden;border:2px solid var(--border);box-shadow:0 14px 30px rgba(0,0,0,.18);display:flex}
  .video .clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .video .clip .e{font-size:120px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}
  .video .clip .e.play{animation:float 2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-14px) rotate(3deg) scale(1.05)}}
  .scan{position:absolute;left:0;right:0;height:4px;background:rgba(255,255,255,.75);filter:blur(2px);animation:scan 2.4s ease-in-out infinite}
  @keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
  .v-tags{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
  .v-tag{background:rgba(0,0,0,.45);color:#fff;font-size:14px;font-weight:700;padding:4px 11px;border-radius:999px;backdrop-filter:blur(4px)}
  .v-tag.loop{background:var(--coral);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .v-speed{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.45);color:#fff;font-size:14px;font-weight:800;padding:4px 11px;border-radius:999px}
  .v-controls{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--border);background:var(--card);border-radius:18px;padding:8px 12px}
  .v-controls .ply{font-size:30px}
  .v-loop{font-size:24px;padding:5px 12px;border-radius:12px;font-weight:700;opacity:.5}
  .v-loop.on{background:var(--coral);color:#fff;opacity:1}
  .speeds{display:flex;gap:6px}
  .speeds button{padding:7px 11px;border-radius:12px;font-size:17px;font-weight:900;border:2px solid var(--border);background:var(--card)}
  .speeds button.on{background:var(--coral);color:#fff;border-color:var(--coral)}

  .right-col{display:flex;flex-direction:column;gap:16px}
  .step-card{background:var(--panel);border:2px solid var(--border);border-radius:26px;padding:20px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
  .step-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .step-num{width:56px;height:56px;border-radius:18px;background:var(--coral);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step-head h2{font-size:30px;font-weight:900;line-height:1.1}
  .step-card p{font-size:25px;font-weight:500;line-height:1.5}
  .speaking{display:none;align-items:center;gap:9px;color:var(--coral);font-weight:800;font-size:20px;margin-top:16px}
  .speaking.on{display:flex;animation:pulse 1.2s infinite}
  .speaking .bars{display:flex;gap:4px}
  .speaking .bars i{width:6px;height:22px;background:var(--coral);border-radius:999px;transform-origin:bottom;animation:eq .7s ease-in-out infinite}
  .speaking .bars i:nth-child(2){animation-delay:.15s}
  .speaking .bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  .ing-card{background:var(--card);border:2px solid var(--border);border-radius:26px;padding:20px}
  .ing-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .ing-head h3{font-size:21px;font-weight:800}
  .toggle{display:flex;border:2px solid var(--border);border-radius:999px;overflow:hidden;font-size:16px;font-weight:900}
  .toggle button{padding:7px 13px}
  .toggle button.on{background:var(--coral);color:#fff}
  .ing-list{list-style:none;display:flex;flex-direction:column;gap:9px}
  .ing-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:2px solid var(--border);border-radius:18px;padding:13px 16px}
  .ing-name{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:700}
  .ing-name .e{font-size:30px}
  .ing-amt{font-size:24px;font-weight:900;color:var(--coral)}

  /* טיימר */
  .timer{border:2px solid var(--border);background:var(--card);border-radius:26px;padding:20px}
  .timer.done{border-color:var(--coral);background:rgba(255,71,87,.1);animation:explode .6s ease-in-out 2}
  @keyframes explode{0%{transform:scale(1)}20%{transform:scale(1.05) rotate(-1deg)}40%{transform:scale(.98) rotate(1deg)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
  .timer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:20px;font-weight:800}
  .timer-alert{display:none;color:var(--coral);font-weight:900;animation:ring .5s infinite}
  .timer.done .timer-alert{display:inline}
  @keyframes ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .timer-clock{text-align:center;font-size:64px;font-weight:900;line-height:1;margin-bottom:12px}
  .timer.done .timer-clock{color:var(--coral);animation:flash .7s infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
  .timer-bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;margin-bottom:16px}
  .timer-bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--amber));transition:width 1s linear}
  .timer.done .timer-bar>i{background:var(--coral)}
  .timer-btns{display:flex;gap:12px}
  .timer-btns .go{flex:1;border-radius:16px;padding:13px;font-size:23px;font-weight:900;background:var(--green);color:#fff}
  .timer-btns .go.pause{background:var(--amber);color:#1e293b}
  .timer-btns .go:disabled{opacity:.4}
  .timer-btns .rst{border:2px solid var(--border);border-radius:16px;padding:13px 22px;font-size:23px;font-weight:900}

  /* בקרת ידיים חופשיות */
  .controls{background:var(--panel);border-top:2px solid var(--border);padding:16px;box-shadow:0 -8px 24px rgba(0,0,0,.1)}
  .controls .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:820px;margin:0 auto}
  .ctrl{border-radius:18px;padding:16px 8px;font-size:24px;font-weight:900;text-align:center;transition:transform .12s}
  .ctrl:active{transform:scale(.96)}
  .ctrl small{display:block;font-size:14px;font-weight:700;opacity:.7;margin-top:3px}
  .ctrl.prev{border:2px solid var(--border)}
  .ctrl.prev:disabled{opacity:.3}
  .ctrl.rep{background:var(--amber);color:#1e293b}
  .ctrl.next{background:linear-gradient(90deg,var(--coral),var(--coral2));color:#fff}

  /* טוסט מחווה */
  .gesture{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .gesture>div{background:rgba(0,0,0,.78);color:#fff;font-size:48px;font-weight:900;padding:24px 44px;border-radius:26px;animation:pop .3s ease-out}
  @keyframes pop{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

  /* כפתור התקנה */
  .install{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:95;background:#1e293b;color:#fff;
    border-radius:999px;padding:13px 22px;font-size:18px;font-weight:800;box-shadow:0 10px 26px rgba(0,0,0,.3);display:none;align-items:center;gap:9px}
  .install.show{display:flex;animation:pop .3s ease-out}
</style>
</head>
<body data-theme="light">
  <div class="app" id="app"></div>
  <button class="install" id="installBtn">⬇️ התקן את ChefTok כאפליקציה</button>
  <div class="gesture" id="gesture" style="display:none"><div id="gestureText"></div></div>

<script>
/* ============================================================
   ChefTok — אפליקציית בישול אינטראקטיבית מתקינה (PWA)
   ============================================================ */
const RECIPES = [
  {
    id:'mousse', title:`עוגת מוס שוקולד ופרלינה חגיגית`, chef:`השף דניאל לוי`, emoji:`🍫`,

       ingredients:[{name:`שמנת מתוקה`,emoji:`🥛`,metric:`250 מ"ל`,home:`כוס אחת`},{name:`סוכר`,emoji:`🍚`,metric:`30 גרם`,home:`2 כפות`}]},

       ingredients:[{name:`שוקולד מריר 70%`,emoji:`🍫`,metric:`300 גרם`,home:`1.5 חבילות`},{name:`חמאה`,emoji:`🧈`,metric:`50 גרם`,home:`3 כפות`}]},
      {title:`קיפול עדין של המוס`, emoji:`🌀`,

       ingredients:[{name:`תערובת שוקולד`,emoji:`🍫`,metric:`מהשלב הקודם`,home:`מהשלב הקודם`},{name:`שמנת מוקצפת`,emoji:`🥛`,metric:`מהשלב 2`,home:`מהשלב 2`}]},
      {title:`קירור וקישוט`, emoji:`❄️`, timer:{seconds:120,label:`התייצבות במקרר`},
       instruction:`מעבירים את העוגה לקירור עד להתייצבות מלאה, מפזרים מעל קקאו ופנינים זהובות לפני ההגשה.`,
       ingredients:[{name:`אבקת קקאו`,emoji:`🟤`,metric:`10 גרם`,home:`1 כף`},{name:`פנינים זהב`,emoji:`✨`,metric:`לקישוט`,home:`לקישוט`}]}
    ]
  },
  {
    id:'pasta', title:`פסטה רוזה ביתית מושלמת ב-15 דקות`, chef:`השפית נועה ברק`, emoji:`🍝`,
    grad:`linear-gradient(135deg,#ff6b6b,#ff8e72,#ffb88c)`, difficulty:`מהיר`, totalTime:`15 דקות`, badge:`בישול מהיר`,
    steps:[

       ingredients:[{name:`מים`,emoji:`💧`,metric:`2 ליטר`,home:`8 כוסות`},{name:`מלח גס`,emoji:`🧂`,metric:`15 גרם`,home:`1 כף`},{name:`פסטה פנה`,emoji:`🍝`,metric:`250 גרם`,home:`2.5 כוסות`}]},
      {title:`הכנת בסיס הרוטב`, emoji:`🍅`,
       instruction:`מטגנים שום קצוץ בשמן זית עד להזהבה, מוסיפים רסק עגבניות ומבשלים דקה לשחרור הצבע והטעם.`,
       ingredients:[{name:`שמן זית`,emoji:`🫒`,metric:`30 מ"ל`,home:`2 כפות`},{name:`שום`,emoji:`🧄`,metric:`2 שיניים`,home:`2 שיניים`},{name:`רסק עגבניות`,emoji:`🍅`,metric:`45 גרם`,home:`3 כפות`}]},
      {title:`הפיכת הרוטב לרוזה`, emoji:`🌸`,
       instruction:`מוסיפים שמנת מתוקה ופרמזן מגורר, מערבבים על אש נמוכה עד לרוטב קטיפתי בגוון ורוד.`,
       ingredients:[{name:`שמנת מתוקה`,emoji:`🥛`,metric:`200 מ"ל`,home:`3/4 כוס`},{name:`פרמזן מגורר`,emoji:`🧀`,metric:`50 גרם`,home:`1/2 כוס`}]},
      {title:`איחוד והגשה`, emoji:`🌿`,
       instruction:`מערבבים את הפסטה ברוטב עם מעט ממי הבישול עד לציפוי מושלם, מגישים עם עלי בזיליקום טריים.`,
       ingredients:[{name:`מי בישול`,emoji:`💧`,metric:`60 מ"ל`,home:`1/4 כוס`},{name:`בזיליקום טרי`,emoji:`🌿`,metric:`חופן`,home:`חופן`}]}
    ]
  },
  {
    id:'sourdough', title:`לחם מחמצת כפרי עם אחוז הידרציה גבוה`, chef:`האופה איתי גבע`, emoji:`🍞`,
    grad:`linear-gradient(135deg,#a9743f,#c79a5b,#e8c887)`, difficulty:`מתקדם`, totalTime:`24 שעות`, badge:`בצק מתקדם`,
    steps:[
      {title:`רענון המחמצת`, emoji:`🫧`, timer:{seconds:90,label:`הפעלת המחמצת`},
       instruction:`מאכילים את המחמצת בקמח מלא ומים פושרים, ממתינים עד שמכפילה את נפחה וצפה במים.`,
       ingredients:[{name:`מחמצת פעילה`,emoji:`🫧`,metric:`50 גרם`,home:`3 כפות`},{name:`קמח מלא`,emoji:`🌾`,metric:`50 גרם`,home:`1/3 כוס`},{name:`מים פושרים`,emoji:`💧`,metric:`50 מ"ל`,home:`3 כפות`}]},
      {title:`אוטוליזה — מנוחת הבצק`, emoji:`😴`, timer:{seconds:60,label:`אוטוליזה`},
       instruction:`מערבבים קמח ומים בלבד ללא לישה ומניחים למנוחה. שלב זה מפתח גלוטן באופן טבעי ללא מאמץ.`,
       ingredients:[{name:`קמח לחם`,emoji:`🌾`,metric:`500 גרם`,home:`4 כוסות`},{name:`מים`,emoji:`💧`,metric:`375 מ"ל`,home:`1.5 כוסות`}]},
      {title:`לישה וקיפולים`, emoji:`💪`, timer:{seconds:75,label:`סדרת קיפולים`},
       instruction:`מוסיפים מלח ומחמצת, מבצעים סדרת קיפולים נמרצים מהצד אל המרכז עד שהבצק חלק ואלסטי.`,
       ingredients:[{name:`מלח ים`,emoji:`🧂`,metric:`10 גרם`,home:`2 כפיות`},{name:`מחמצת מהשלב 1`,emoji:`🫧`,metric:`100 גרם`,home:`6 כפות`}]},
      {title:`תפיחה ראשונה בטמפ' החדר`, emoji:`🎈`, timer:{seconds:90,label:`תפיחה ראשונה`},
       instruction:`מכסים ומניחים לתפיחה. מבצעים קיפול עדין כל 30 דקות עד שהבצק תופח ומתמלא בועות אוויר.`,
       ingredients:[{name:`הבצק מהשלב הקודם`,emoji:`🍥`,metric:`כל הכמות`,home:`כל הכמות`}]},
      {title:`עיצוב וקירור לילה`, emoji:`🌙`,
       instruction:`מעצבים את הבצק לכדור מתוח, מעבירים לסלסלת הקמחה ולמקרר ללילה שלם לפיתוח טעמים חמצמצים.`,
       ingredients:[{name:`קמח אורז לפיזור`,emoji:`🌾`,metric:`20 גרם`,home:`2 כפות`}]},
      {title:`אפייה בסיר יצקת`, emoji:`🔥`, timer:{seconds:120,label:`אפייה מכוסה`},
       instruction:`אופים בסיר לוהט ומכוסה ליצירת קרום, ואז חושפים להזהבה מושלמת. מצננים על רשת לפני הפריסה.`,
       ingredients:[{name:`הבצק התפוח`,emoji:`🍞`,metric:`כיכר אחת`,home:`כיכר אחת`}]}
    ]
  }
];

/* ---------- כלי עזר ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const x=new C();const o=x.createOscillator(),g=x.createGain();o.connect(g);g.connect(x.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.3,x.currentTime);o.start();g.gain.exponentialRampToValueAtTime(.001,x.currentTime+.6);o.stop(x.currentTime+.6);}catch(e){}}

/* ---------- מצב ---------- */
const state={screen:'home',recipeId:null,stepIndex:0,unitMode:'metric',dark:false,url:'',playing:true,looping:true,speed:1};
let timer={id:null,remaining:0,running:false,done:false,total:0};
let gestureTO=null;

const recipe=()=>RECIPES.find(r=>r.id===state.recipeId);
const step=()=>recipe().steps[state.stepIndex];

/* ---------- ניווט ופעולות ---------- */
function startCooking(id){state.recipeId=id;state.stepIndex=0;state.unitMode='metric';state.playing=true;state.looping=true;state.speed=1;state.screen='cook';render();}
function exitCooking(){try{speechSynthesis.cancel()}catch(e){}stopTimer();state.screen='home';state.recipeId=null;render();}
function gotoStep(i){state.stepIndex=i;render();}
function next(){const r=recipe();if(state.stepIndex<r.steps.length-1){state.stepIndex++;flash('➡️ הבא');render();}else{flash('🎉 סיימת!');}}
function prev(){if(state.stepIndex>0){state.stepIndex--;flash('⬅️ חזרה');render();}}
function repeat(){flash('🔊 קורא שוב');speak();}
function setUnit(m){state.unitMode=m;render();}
function setSpeed(s){state.speed=s;render();}
function togglePlay(){state.playing=!state.playing;render();}
function toggleLoop(){state.looping=!state.looping;render();}
function toggleTheme(){state.dark=!state.dark;document.body.dataset.theme=state.dark?'dark':'light';
  document.querySelector('meta[name=theme-color]').setAttribute('content',state.dark?'#020617':'#ff4757');render();}

function flash(label){const g=$('gesture');$('gestureText').textContent=label;g.style.display='flex';
  $('gestureText').style.animation='none';void $('gestureText').offsetWidth;$('gestureText').style.animation='';
  if(gestureTO)clearTimeout(gestureTO);gestureTO=setTimeout(()=>{g.style.display='none';},1000);}

function speak(){const s=step();const ing=s.ingredients.map(i=>i.name+', '+(state.unitMode==='metric'?i.metric:i.home)).join('. ');
  const full='שלב '+(state.stepIndex+1)+'. '+s.title+'. '+s.instruction+'. המצרכים: '+ing;
  const el=document.querySelector('.speaking');if(el)el.classList.add('on');
  try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(full);u.lang='he-IL';u.rate=.95;
    u.onend=()=>el&&el.classList.remove('on');u.onerror=()=>el&&el.classList.remove('on');speechSynthesis.speak(u);}
    else{setTimeout(()=>el&&el.classList.remove('on'),2200);}}catch(e){setTimeout(()=>el&&el.classList.remove('on'),2200);}}

/* ---------- טיימר ---------- */
function stopTimer(){if(timer.id){clearInterval(timer.id);timer.id=null;}timer.running=false;}
function setupTimer(seconds){stopTimer();timer={id:null,remaining:seconds,running:false,done:false,total:seconds};}
function toggleTimer(){if(timer.done)return;timer.running=!timer.running;
  if(timer.running){timer.id=setInterval(tick,1000);}else{stopTimer();}updateTimerUI();}
function resetTimer(){const t=timer.total;stopTimer();timer={id:null,remaining:t,running:false,done:false,total:t};updateTimerUI();}
function tick(){timer.remaining--;if(timer.remaining<=0){timer.remaining=0;timer.done=true;stopTimer();beep();}updateTimerUI();}
function updateTimerUI(){const box=$('timerBox');if(!box)return;
  box.classList.toggle('done',timer.done);
  $('timerClock').textContent=timer.done?'0:00':fmt(timer.remaining);
  $('timerFill').style.width=Math.max(0,Math.min(100,(timer.remaining/timer.total)*100))+'%';
  const go=$('timerGo');go.disabled=timer.done;go.classList.toggle('pause',timer.running);
  go.textContent=timer.running?'⏸️ השהה':'▶️ התחל';}

/* ============================================================
   רינדור
   ============================================================ */
function render(){state.screen==='home'?renderHome():renderCook();}

function renderHome(){
  $('app').innerHTML=`
  <header class="home-head">
    <div class="ghost">🍳</div>
    <div class="home-row">
      <div class="logo"><span class="e">🧑‍🍳</span><h1>ChefTok</h1></div>
      <button class="chip-btn" onclick="toggleTheme()">${state.dark?'☀️ יום':'🌙 ערב'}</button>
    </div>
    <p class="home-sub">הופכים סרטוני בישול קצרים למתכון אינטראקטיבי — בלי לגעת במסך 👐</p>
  </header>
  <main class="home-main">
    <div class="input-card">
      <label class="input-label">🔗 הדביקו קישור לסרטון TikTok / YouTube</label>
      <input class="url-input" id="urlInput" placeholder="https://tiktok.com/@chef/video..." value="${esc(state.url)}">
      <button class="start-btn" onclick="startCooking('pasta')">⚡ התחל לבשל בטכנולוגיית Hands-Free</button>
    </div>
    <div class="sec-row"><h2>🔥 מתכונים מומלצים</h2><span>${RECIPES.length} מתכונים</span></div>
    ${RECIPES.map(r=>`
      <button class="recipe-card" onclick="startCooking('${r.id}')">
        <div class="thumb" style="background:${r.grad}">
          <span class="e">${r.emoji}</span>
          <span class="steps">▶ ${r.steps.length} שלבים</span>
        </div>
        <div class="r-body">
          <span class="r-badge">${r.badge}</span>
          <h3>${esc(r.title)}</h3>
          <p class="r-chef">${esc(r.chef)}</p>
          <div class="r-meta"><span>⏱️ ${r.totalTime}</span><span>•</span><span>📊 ${r.difficulty}</span></div>
        </div>
      </button>`).join('')}
  </main>`;
  const inp=$('urlInput');if(inp)inp.addEventListener('input',e=>state.url=e.target.value);
}

function renderCook(){
  const r=recipe(),s=step(),i=state.stepIndex;
  const amt=ing=>state.unitMode==='metric'?ing.metric:ing.home;
  $('app').innerHTML=`
  <div class="top-bar">
    <button class="x" onclick="exitCooking()" aria-label="יציאה">✕</button>
    <div class="live"><span class="dot"></span>📡 זיהוי מחוות וקול פעיל (מצב מטבח)</div>
    <button class="x" onclick="toggleTheme()" aria-label="תאורה">${state.dark?'☀️':'🌙'}</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span class="title">${esc(r.title)}</span>
      <span class="count">שלב ${i+1}/${r.steps.length}</span>
    </div>
    <div class="bar"><i style="width:${((i+1)/r.steps.length)*100}%"></i></div>
    <div class="dots">
      ${r.steps.map((_,k)=>`<button class="dot-step ${k<i?'done':k===i?'cur':''}" onclick="gotoStep(${k})">${k<i?'✓':k+1}</button>`).join('')}
    </div>
  </div>

  <div class="cook-body">
    <div>
      <div class="video" style="background:${r.grad}">
        <div class="clip"><span class="e ${state.playing?'play':''}" style="animation-duration:${2/state.speed}s">${s.emoji}</span></div>
        ${state.playing?`<div class="scan" style="animation-duration:${2.4/state.speed}s"></div>`:''}
        <div class="v-tags">
          <span class="v-tag">🔁 קטע השלב הנוכחי</span>
          ${state.looping?`<span class="v-tag loop">LOOP</span>`:''}
        </div>
        <span class="v-speed">×${state.speed}</span>
      </div>
      <div class="v-controls">
        <button class="ply" onclick="togglePlay()" aria-label="הפעל/השהה">${state.playing?'⏸️':'▶️'}</button>
        <button class="v-loop ${state.looping?'on':''}" onclick="toggleLoop()" aria-label="לולאה">🔁</button>
        <div class="speeds">
          ${[0.5,1,1.5,2].map(sp=>`<button class="${state.speed===sp?'on':''}" onclick="setSpeed(${sp})">×${sp}</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="step-card">
        <div class="step-head">
          <span class="step-num">${i+1}</span>
          <h2>${esc(s.title)}</h2>
        </div>
        <p>${esc(s.instruction)}</p>
        <div class="speaking">🔊 קורא בקול <span class="bars"><i></i><i></i><i></i></span></div>
      </div>

      <div class="ing-card">
        <div class="ing-head">
          <h3>🧺 מצרכים לשלב זה</h3>
          <div class="toggle">
            <button class="${state.unitMode==='metric'?'on':''}" onclick="setUnit('metric')">⚖️ גרמים</button>
            <button class="${state.unitMode==='home'?'on':''}" onclick="setUnit('home')">🥄 ביתי</button>
          </div>
        </div>
        <ul class="ing-list">
          ${s.ingredients.map(ing=>`<li>
            <span class="ing-name"><span class="e">${ing.emoji}</span>${esc(ing.name)}</span>
            <span class="ing-amt tnum">${esc(amt(ing))}</span></li>`).join('')}
        </ul>
      </div>

      ${s.timer?`
      <div class="timer" id="timerBox">
        <div class="timer-head"><span>⏱️ ${esc(s.timer.label)}</span><span class="timer-alert">🔔 הזמן נגמר!</span></div>
        <div class="timer-clock tnum" id="timerClock"></div>
        <div class="timer-bar"><i id="timerFill"></i></div>
        <div class="timer-btns">
          <button class="go" id="timerGo" onclick="toggleTimer()"></button>
          <button class="rst" onclick="resetTimer()">🔄 איפוס</button>
        </div>
      </div>`:''}
    </div>
  </div>

  <div class="controls">
    <div class="grid">
      <button class="ctrl prev" onclick="prev()" ${i===0?'disabled':''}>⬅️ חזור<small>חץ ימינה</small></button>
      <button class="ctrl rep" onclick="repeat()">🔊 קרא שוב<small>מקש V</small></button>
      <button class="ctrl next" onclick="next()">הבא ➡️<small>רווח / חץ שמאלה</small></button>
    </div>
  </div>`;

  if(s.timer){setupTimer(s.timer.seconds);updateTimerUI();}else{stopTimer();}
}

/* ---------- מקלדת (ידיים חופשיות) ---------- */
document.addEventListener('keydown',e=>{
  if(state.screen!=='cook')return;
  if(e.code==='Space'||e.key==='ArrowLeft'){e.preventDefault();next();}
  else if(e.key==='ArrowRight'){e.preventDefault();prev();}
  else if(e.key==='v'||e.key==='V'||e.key==='ו'){e.preventDefault();repeat();}
});

/* ---------- כפתור התקנה (PWA) ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.add('show');});
$('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').classList.remove('show');});
window.addEventListener('appinstalled',()=>{$('installBtn').classList.remove('show');});

/* ---------- Service Worker ---------- */
if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw-cheftok.js').catch(()=>{});});}

render();
</script>
</body>
</html>
